<!DOCTYPE html>
<html>
<head>
    <title>Make.com Template Detail Mock</title>
</head>
<body>

    <div class="scenario-canvas">
        <canvas data-test-id="canvas"></canvas>
        <div data-test-id="module">
            <img src="typeform.png" alt="Typeform">

        </div>
        <div data-test-id="module">
            <img src="google-sheets.png" alt="Google Sheets">
            <span data-test-id="module-name">Google Sheets</span>
        </div>
    </div>
</body>
</html>
